services:
  - type: web
    name: linkup-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://linkup-worksocial-cloud.vercel.app,http://localhost:3000,http://localhost:5173
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
